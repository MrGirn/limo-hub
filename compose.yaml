      - VENDOR_CITY=New York
      - GLOBAL_HUB_URL=http://limo-global-hub:8000
      - HUB_MODE=false
      - PROD_MODE=true
      - PORT=8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./packages:/app/packages
      - ./app:/app/app
      - ./frontend:/app/frontend
      - ./limo_database.db:/app/limo_database.db
    networks:
      - limo-net
    depends_on:
      - limo-global-hub

  vendor-cell-london:

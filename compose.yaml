services:
  # ==========================================
  # 1. CENTRAL GLOBAL HUB CLEARINGHOUSE (Port 8000)
  # ==========================================
  limo-global-hub:
    build:
      context: .
      dockerfile: packages/global_hub/Dockerfile
    container_name: limo-global-hub
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://root:%21891Mdsaaf@host.docker.internal:3306/limo_db
      - MYSQL_URL=mysql+pymysql://root:%21891Mdsaaf@host.docker.internal:3306/limo_db
      - HUB_MODE=true
      - PROD_MODE=false
      - PORT=8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./packages:/app/packages
      - ./app:/app/app
      - ./frontend:/app/frontend
      - ./data:/app/data
      - ./limo_database.db:/app/limo_database.db
    networks:
      - limo-net

  # ==========================================
  # 2. SOVEREIGN VENDOR CELLS (LOCAL AFFILIATES)
  # ==========================================
  vendor-cell-philly:
    build:
      context: .
      dockerfile: Dockerfile.vendor
    container_name: vendor-cell-philly
    restart: always
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://root:%21891Mdsaaf@host.docker.internal:3306/limo_db
      - MYSQL_URL=mysql+pymysql://root:%21891Mdsaaf@host.docker.internal:3306/limo_db
      - SOVEREIGN_VENDOR_ID=vendor_anb_philly
      - VENDOR_NAME=ANB Trans Inc
      - VENDOR_CITY=Philadelphia
      - GLOBAL_HUB_URL=http://limo-global-hub:8000
      - HUB_MODE=false
      - PROD_MODE=true
      - PORT=8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./packages:/app/packages
      - ./app:/app/app
      - ./frontend:/app/frontend
      - ./limo_database.db:/app/limo_database.db
    networks:
      - limo-net
    depends_on:
      - limo-global-hub

  vendor-cell-ny:

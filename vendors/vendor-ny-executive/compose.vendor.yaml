services:
  limo-cell-ny-executive:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: limo-cell-ny-executive
    restart: always
    ports:
      - "8002:8000"
    env_file:
      - ../../.env
      - ./vendor.env
    environment:
      - MYSQL_HOST=limo-mysql
      - MYSQL_PORT=3306
      - GLOBAL_HUB_URL=http://limo-global-hub:8000
    depends_on:
      limo-mysql:
        condition: service_healthy
    networks:
      - limo-net

services:
  limo-cell-tokyo-sovereign:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: limo-cell-tokyo-sovereign
    restart: always
    ports:
      - "8006:8000"
    env_file:
      - ../../.env
      - ./vendor.env
    environment:
      - MYSQL_HOST=host.docker.internal
      - MYSQL_PORT=3306
      - GLOBAL_HUB_URL=http://limo-global-hub:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - limo-net
